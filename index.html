<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Forbes Membership: analytical materials for membership strategy, by country.">
<link rel="preload" as="font" type="font/woff2" href="fonts/ForbesHighlander-Regular-Web.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/FavoritPro-Book.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/FavoritPro-Bold.woff2" crossorigin>
<link rel="stylesheet" href="fonts/favorit.css">
<link rel="stylesheet" href="motion.css">
<title>Forbes Membership – Analytical Materials</title>
<script>(function(){var saved=localStorage.getItem('theme');document.documentElement.dataset.theme=saved||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');})();</script>
<style>
@font-face{font-family:'ForbesHighlander';src:url('fonts/ForbesHighlander-Regular-Web.woff2') format('woff2'),url('fonts/ForbesHighlander-Regular-Web.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'ForbesHighlander';src:url('fonts/ForbesHighlander-Bold-Web.woff2') format('woff2'),url('fonts/ForbesHighlander-Bold-Web.woff') format('woff');font-weight:700;font-style:normal;font-display:swap}

:root {
  --bg:            #ffffff;
  --bg-2:          #f8fafc;
  --text:          #020617;
  --text-2:        #64748b;
  --text-choose:   #475569;
  --surface-tert:  #f1f5f9;
  --border:        #e2e8f0;
  --rose:          #e11d48;
  --forbes-red:    #e50b16;
  --sans:          'Favorit Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --serif:         'ForbesHighlander', Georgia, serif;
}
[data-theme="dark"] {
  --bg:            #020617;
  --bg-2:          #0f172a;
  --text:          #ffffff;
  --text-2:        #cbd5e1;
  --text-choose:   #cbd5e1;
  --surface-tert:  #334155;
  --border:        #334155;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-kerning: normal;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}

.theme-btn {
  position: fixed;
  top: 24px; right: 24px;
  z-index: 10;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-2);
  border-radius: 8px;
  transition: color 150ms cubic-bezier(0.25,1,0.5,1), background 150ms cubic-bezier(0.25,1,0.5,1);
}
.theme-btn:hover { color: var(--text); background: var(--bg-2); }
.theme-btn:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.icon-moon { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun  { display: block; }
[data-theme="light"] .icon-sun  { display: none; }
[data-theme="light"] .icon-moon { display: block; }

.intro-main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 80px;
  padding: 120px 45px;
  min-height: 100vh;
}

.intro-top {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
  width: 730px;
  max-width: 100%;
}
.badge-membership {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 4px 8px;
  border-radius: 4px;
  background: var(--forbes-red);
  color: #fff;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 12px;
  white-space: nowrap;
}
.intro-top h1 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 48px;
  line-height: 1.083;
  letter-spacing: -0.48px;
  color: var(--text);
  text-wrap: balance;
}

.intro-country {
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 730px;
  max-width: 100%;
}
.choose-country {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 32px;
  line-height: 1.24;
  color: var(--text-choose);
}

.country-list {
  display: flex;
  flex-direction: column;
  width: 100%;
}
.country-opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 24px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: inherit;
  text-decoration: none;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 18px;
  letter-spacing: -0.18px;
  color: var(--text);
  transition: background 150ms cubic-bezier(0.25,1,0.5,1), border-color 150ms cubic-bezier(0.25,1,0.5,1);
  position: relative;
}
.country-list a.country-opt:hover { background: var(--bg-2); border-color: var(--rose); z-index: 1; }
.country-list a.country-opt:focus-visible { outline: 2px solid var(--rose); outline-offset: -2px; }
.country-opt + .country-opt { margin-top: -1px; }
.country-opt:first-child { border-radius: 12px 12px 0 0; }
.country-opt:last-child { border-radius: 0 0 12px 12px; }
.country-opt.disabled { cursor: default; }
.country-opt .opt-label {
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform 200ms cubic-bezier(0.25,1,0.5,1);
}
.country-list a.country-opt:hover .opt-label { transform: translateX(3px); }
.country-opt.disabled .opt-text { opacity: .4; }
.country-opt .opt-text { display: inline-block; }
.flag {
  flex-shrink: 0;
  font-size: 22px;
  line-height: 1;
}
.country-opt.disabled .flag { opacity: .4; }
.badge-soon {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: 4px;
  background: var(--surface-tert);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 500;
  font-size: 10px;
  line-height: 13px;
  white-space: nowrap;
}
.chevron {
  flex-shrink: 0;
  color: var(--text-2);
  transition: transform 200ms cubic-bezier(0.25,1,0.5,1), color 150ms cubic-bezier(0.25,1,0.5,1);
}
.country-list a.country-opt:hover .chevron { transform: translateX(4px); color: var(--rose); }
.country-opt.disabled .chevron { opacity: .4; }

/* ── Entrance ── */
.intro-top { animation: rise-in 420ms cubic-bezier(0.2,0.8,0.2,1) both; }
.choose-country { animation: rise-in 420ms cubic-bezier(0.2,0.8,0.2,1) both 80ms; }
.country-opt { animation: rise-in 420ms cubic-bezier(0.2,0.8,0.2,1) both; }
.country-opt:nth-child(1) { animation-delay: 160ms; }
.country-opt:nth-child(2) { animation-delay: 210ms; }
.country-opt:nth-child(3) { animation-delay: 260ms; }
@keyframes rise-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 800px) {
  .intro-main { padding: 64px 20px; gap: 48px; }
  .intro-top h1 { font-size: 34px; }
  .choose-country { font-size: 24px; }
  .country-opt { padding: 18px; font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>

<main class="intro-main">

  <div class="intro-top">
    <span class="badge-membership">Forbes Membership</span>
    <h1>Analytical Materials for Membership</h1>
  </div>

  <div class="intro-country">
    <p class="choose-country">Choose country</p>
    <div class="country-list">

      <a class="country-opt" href="forbes_cz_index.html">
        <span class="opt-label">
          <span class="flag" aria-hidden="true">🇨🇿</span>
          <span class="opt-text">Forbes Czechia</span>
        </span>
        <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>

      <a class="country-opt" href="forbes_hu_index.html">
        <span class="opt-label">
          <span class="flag" aria-hidden="true">🇭🇺</span>
          <span class="opt-text">Forbes Hungary</span>
        </span>
        <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>

      <div class="country-opt disabled" aria-disabled="true">
        <span class="opt-label">
          <span class="flag" aria-hidden="true">🇸🇰</span>
          <span class="opt-text">Forbes Slovakia</span>
          <span class="badge-soon">Coming Soon</span>
        </span>
        <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>

    </div>
  </div>

</main>

<script src="theme.js"></script>
</body>
</html>
